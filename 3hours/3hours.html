<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0 } body { background: #000; overflow: hidden; }
  </style>
</head>
<body>
<script type="module">
  import * as GaussianSplats3D from 
    'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@latest/src/index.js';

  const viewer = new GaussianSplats3D.Viewer({
    initialCameraPosition: [0, 0, 5],
    initialCameraLookAt: [0, 0, 0],
  });

  await viewer.addSplatScene('YOUR_HUGGINGFACE_URL_HERE');
  viewer.start();
</script>
</body>
</html>
